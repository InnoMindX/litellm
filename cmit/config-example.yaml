litellm_settings: # module level litellm settings - https://github.com/BerriAI/litellm/blob/main/litellm/__init__.py
  # drop_params: True
  cache: True
  cache_params:
    type: local
    default_in_memory_ttl: 300
  # default_fallbacks: ["llama-3.3-70b"]
  # callbacks: panzhi_auth_headers_callbacks.auth_handler_instance # sets litellm.callbacks = [proxy_handler_instance]
  # success_callback: ["langfuse"] # OPTIONAL - if you want to start sending LLM Logs to Langfuse. Make sure to set `LANGFUSE_PUBLIC_KEY` and `LANGFUSE_SECRET_KEY` in your env

# router_settings:
#   model_group_alias: {"Qwen*": "llama-3.3-70b"} # all requests will be routed to models with the same name
general_settings: 
  master_key: sk-1234 # [OPTIONAL] Only use this if you to require all calls to contain this key (Authorization: Bearer sk-1234)
  # alerting: ["slack"] # [OPTIONAL] If you want Slack Alerts for Hanging LLM requests, Slow llm responses, Budget Alerts. Make sure to set `SLACK_WEBHOOK_URL` in your env